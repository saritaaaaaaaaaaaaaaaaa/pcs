<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro · Receitas Animadas</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FFF8F0;
            --coral: #FF6B6B;
            --coral-dark: #E85555;
            --orange: #FFA552;
            --yellow: #FFD166;
            --brown: #6B3F2A;
            --brown-light: #A0624A;
            --white: #ffffff;
            --shadow: 0 8px 40px rgba(107,63,42,0.13);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--cream);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 40px 16px;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        .blob-1 { width: 380px; height: 380px; background: var(--yellow); top: -80px; right: -80px; animation-delay: 0s; }
        .blob-2 { width: 300px; height: 300px; background: var(--coral); bottom: -60px; left: -60px; animation-delay: -3.5s; }
        .blob-3 { width: 200px; height: 200px; background: var(--orange); top: 50%; left: 50%; animation-delay: -6s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-18px) scale(1.04); }
        }

        .food-float {
            position: fixed;
            font-size: 2rem;
            animation: floatUp 12s linear infinite;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
        }
        @keyframes floatUp {
            0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
            10%  { opacity: 0.7; }
            90%  { opacity: 0.5; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
        .food-float:nth-child(1)  { left: 5%;  animation-delay: 1s;   animation-duration: 13s; font-size: 1.6rem; }
        .food-float:nth-child(2)  { left: 18%; animation-delay: 3s;   animation-duration: 11s; font-size: 2.2rem; }
        .food-float:nth-child(3)  { left: 50%; animation-delay: 0s;   animation-duration: 14s; font-size: 1.5rem; }
        .food-float:nth-child(4)  { left: 72%; animation-delay: 2s;   animation-duration: 10s; font-size: 2rem; }
        .food-float:nth-child(5)  { left: 88%; animation-delay: 4s;   animation-duration: 16s; font-size: 1.8rem; }
        .food-float:nth-child(6)  { left: 35%; animation-delay: 6s;   animation-duration: 12s; font-size: 1.4rem; }

        .card-wrapper {
            position: relative;
            z-index: 10;
            animation: slideUp 0.7s cubic-bezier(.22,1,.36,1) both;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--white);
            border-radius: 28px;
            width: 420px;
            max-width: 100%;
            padding: 42px 38px 36px;
            box-shadow: var(--shadow), 0 2px 0 0 var(--orange) inset, 0 -4px 0 0 var(--yellow) inset;
            position: relative;
        }

        .card::before {
            content: '🧑‍🍳';
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
            animation: wiggle 3.5s ease-in-out infinite;
        }
        @keyframes wiggle {
            0%,100% { transform: translateX(-50%) rotate(-7deg); }
            50%      { transform: translateX(-50%) rotate(7deg); }
        }

        .card-logo {
            text-align: center;
            margin-top: 14px;
            margin-bottom: 24px;
        }
        .card-logo h1 {
            font-family: 'Pacifico', cursive;
            font-size: 1.9rem;
            color: var(--orange);
            line-height: 1;
        }
        .card-logo p {
            font-size: 0.82rem;
            color: var(--brown-light);
            margin-top: 5px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: repeating-linear-gradient(90deg, var(--orange) 0 6px, transparent 6px 10px);
        }
        .divider span { font-size: 1.1rem; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 18px;
        }
        .field { margin-bottom: 15px; }
        .field.full { grid-column: 1 / -1; }
        .field label {
            display: block;
            font-size: 0.74rem;
            font-weight: 800;
            color: var(--brown);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .field .input-wrap { position: relative; }
        .field .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
        }
        .field input,
        .field select {
            width: 100%;
            padding: 11px 12px 11px 38px;
            border: 2.5px solid #EDE0D4;
            border-radius: 12px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--brown);
            background: var(--cream);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }
        .field select { cursor: pointer; padding-right: 32px; }
        .field .select-arrow {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 0.8rem;
            color: var(--brown-light);
        }
        .field input:focus,
        .field select:focus {
            border-color: var(--coral);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255,107,107,0.13);
        }
        .field input::placeholder { color: #C5A99A; font-weight: 600; }

        .nivel-info {
            display: flex;
            gap: 6px;
            margin-top: 5px;
        }
        .nivel-badge {
            font-size: 0.68rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
            background: var(--cream);
            color: var(--brown-light);
            border: 1.5px solid #EDE0D4;
        }
        .nivel-badge.green  { background: #E8F8EC; color: #2F9A50; border-color: #A8DFB6; }
        .nivel-badge.blue   { background: #E8F0FF; color: #3056C9; border-color: #A8BFFF; }
        .nivel-badge.red    { background: #FFF0F0; color: var(--coral-dark); border-color: #FFB8B8; }

        .btn-cadastrar {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--orange), var(--yellow));
            border: none;
            border-radius: 14px;
            color: var(--brown);
            font-family: 'Nunito', sans-serif;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 18px rgba(255,165,82,0.38);
            margin-top: 6px;
        }
        .btn-cadastrar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.22), transparent);
            pointer-events: none;
        }
        .btn-cadastrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(255,165,82,0.45);
        }
        .btn-cadastrar:active { transform: translateY(0); }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.88rem;
            color: var(--brown-light);
            font-weight: 600;
        }
        .login-link a {
            color: var(--coral);
            text-decoration: none;
            font-weight: 800;
            border-bottom: 2px solid var(--yellow);
            transition: border-color 0.2s, color 0.2s;
        }
        .login-link a:hover { color: var(--coral-dark); border-color: var(--coral); }

        .terms {
            text-align: center;
            font-size: 0.73rem;
            color: #C5A99A;
            margin-top: 14px;
            font-weight: 600;
        }
        .terms a { color: var(--brown-light); }

        .dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 18px;
        }
        .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
        .dots span:nth-child(2) { background: var(--yellow); }
        .dots span:nth-child(3) { background: var(--coral); }

        img {
            margin: 0;
            height: 120px;
            padding: 0;
        }

    </style>

</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="food-float">🧁</div>
    <div class="food-float">🥦</div>
    <div class="food-float">🍋</div>
    <div class="food-float">🍕</div>
    <div class="food-float">🫙</div>
    <div class="food-float">🥚</div>

    <div class="card-wrapper">
        <div class="card">
            <div class="card-logo">
                <img src="../static/img/logo.png" alt="">
                <p>Crie sua conta e comece a cozinhar! 🥘</p>
            </div>

            <div class="divider"><span>🥄</span></div>

            <form>
                <div class="form-grid">

                    <div class="field full">
                        <label for="contato">Email ou Telefone</label>
                        <div class="input-wrap">
                            <span class="icon">📧</span>
                            <input type="text" id="contato" placeholder="@email.com/xx xxxxxxxxx" required>
                        </div>
                    </div>

                    <div class="field full">
                        <label for="usuario">Nome de Usuário</label>
                        <div class="input-wrap">
                            <span class="icon">👤</span>
                            <input type="text" id="usuario" placeholder="usuário" required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="senha">Senha</label>
                        <div class="input-wrap">
                            <span class="icon">🔒</span>
                            <input type="password" id="senha" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="nascimento">Nascimento</label>
                        <div class="input-wrap">
                            <span class="icon">🎂</span>
                            <input type="date" id="nascimento" required>
                        </div>
                    </div>

                    <div class="field full">
                        <label for="nivel">Nível de Experiência</label>
                        <div class="input-wrap">
                            <span class="icon">👨‍🍳</span>
                            <select id="nivel" required>
                                <option value="">Selecione seu nível...</option>
                                <option value="iniciante">🌱 Iniciante</option>
                                <option value="normal">🍴 Normal</option>
                                <option value="avancado">⭐ Avançado</option>
                            </select>
                            <span class="select-arrow">▼</span>
                        </div>
                        <div class="nivel-info">
                            <span class="nivel-badge green">🌱 Aprendiz</span>
                            <span class="nivel-badge blue">🍴 Cozinheiro</span>
                            <span class="nivel-badge red">⭐ Chef</span>
                        </div>
                    </div>

                </div>

                <button type="submit" class="btn-cadastrar">Criar Minha Conta 🍽️</button>
            </form>

            <div class="login-link">
                Já tem conta? <a href="login.html">Fazer login</a>
            </div>

            <div class="terms">
                Ao criar conta você concorda com nossos <a href="#">Termos de Uso</a>
            </div>

            <div class="dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

</body>
</html>
